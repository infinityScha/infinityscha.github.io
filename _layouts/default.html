<!DOCTYPE html>
<html lang="en">
<head>
  <!--for google search verification-->
  <meta name="google-site-verification" content="DkZ49TWxMBsEA2MR-3h0rCvMFHvcQRS0hdfUV-tKvZA" />

  <title>{% if page.title and page.url != '/' %}{{ page.title }} – {% endif %}{{ site.name }}</title>

  {% include meta.html %}

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false})"></script>

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml" />
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top"><div class="wrap wide">
  <a class="brand" href="{{ site.baseurl }}/">{{ site.name }}</a>
  <nav>
    <a href="{{ site.baseurl }}/"{% if page.nav == 'home' %} class="on"{% endif %}>Home</a>
    <a href="{{ site.baseurl }}/projects/"{% if page.nav == 'projects' %} class="on"{% endif %}>Projects</a>
    <a href="{{ site.baseurl }}/posts/"{% if page.nav == 'blog' %} class="on"{% endif %}>Blog</a>
    <button id="theme" aria-label="Toggle theme">&#9790;</button>
  </nav>
</div></header>

<main>
{{ content }}
</main>

<footer><div class="wrap wide">
  <span>&copy; {{ site.time | date: "%Y" }} {{ site.name }}</span>
  <span><a href="https://github.com/{{ site.footer-links.github }}">GitHub</a><a href="https://www.linkedin.com/in/{{ site.footer-links.linkedin }}">LinkedIn</a></span>
</div></footer>

<script>
document.getElementById('theme').onclick=function(){
  var root=document.documentElement;
  var dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}
};
</script>
{% include analytics.html %}
</body>
</html>
